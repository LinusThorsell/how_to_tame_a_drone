apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotor-lab
  labels:
    app.kubernetes.io/name: rotor-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rotor-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rotor-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rotor-lab
          image: YOUR_REGISTRY/rotor-lab:VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rotor-lab
spec:
  selector:
    app.kubernetes.io/name: rotor-lab
  ports:
    - name: http
      port: 80
      targetPort: http

